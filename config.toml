# Engine settings. Every key is optional.
# Active setup: Gemini free tier via Google's OpenAI-compatible
# endpoint. Put the key in the environment (never in this file):
#   export GEMINI_API_KEY=...
# With the env var unset, sessions still run on pack fallback lines.

[model]
provider = "openai-compat"          # openai-compat | anthropic | canned
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
name = "gemini-3.5-flash-lite"
api_key_env = "GEMINI_API_KEY"
temperature = 0.4
max_tokens = 160
timeout_s = 60

# Local, keyless alternative (Ollama):
#   base_url = "http://127.0.0.1:11434/v1"
#   name = "qwen3:4b-instruct-2507-q4_K_M"
#   api_key_env = ""

# LM Studio:   base_url = "http://127.0.0.1:1234/v1"
# llama.cpp:   base_url = "http://127.0.0.1:8080/v1"
# vLLM:        base_url = "http://127.0.0.1:8000/v1"
# OpenRouter:  base_url = "https://openrouter.ai/api/v1",
#              name = "qwen/qwen3-32b", api_key_env = "OPENROUTER_API_KEY"
# Groq:        base_url = "https://api.groq.com/openai/v1",
#              name = "llama-3.3-70b-versatile", api_key_env = "GROQ_API_KEY"
# Anthropic:   provider = "anthropic", name = "claude-haiku-4-5-20251001",
#              api_key_env = "ANTHROPIC_API_KEY"

# Deep post-session review (`python -m harness analyze`). Currently the
# same free-tier Gemini model; point it at something stronger when you
# have a key for one (e.g. provider = "anthropic", name =
# "claude-sonnet-5", key in ANTHROPIC_API_KEY).
[analyze]
provider = "openai-compat"
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
name = "gemini-3.5-flash-lite"
api_key_env = "GEMINI_API_KEY"
max_tokens = 3000

[run]
timeout_s = 30                      # /run and self-check timeout (irun runs
                                    # untimed in your own terminal)
output_max_chars = 4000
backend = "local"                   # "container" sandboxes every run via docker
                                    # (REQUIRED before sharing the web pane; see docs/DEPLOY.md)
# container_image = "python:3.12-slim"
# container_cpus = "1.0"
# container_memory = "512m"

[web]
host = "127.0.0.1"                  # 0.0.0.0 to serve your tailnet (never the open internet)
port = 8765
max_live = 8

[paths]
sessions_dir = "sessions"
