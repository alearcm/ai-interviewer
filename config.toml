# Engine settings. Every key is optional; these are also the defaults.
# The default endpoint is a local Ollama server — no API key needed.

[model]
provider = "openai-compat"          # openai-compat | anthropic | canned
base_url = "http://127.0.0.1:11434/v1"
name = "qwen3:4b-instruct-2507-q4_K_M"
api_key_env = ""                    # name of an env var holding a key, if your endpoint wants one
temperature = 0.4
max_tokens = 160
timeout_s = 60

# LM Studio:  base_url = "http://127.0.0.1:1234/v1"
# llama.cpp:  base_url = "http://127.0.0.1:8080/v1"
# vLLM:       base_url = "http://127.0.0.1:8000/v1"
# Anthropic:  provider = "anthropic", name = "claude-haiku-4-5-20251001",
#             api_key_env = "ANTHROPIC_API_KEY"

[run]
timeout_s = 30                      # /run and irun command timeout
output_max_chars = 4000

[paths]
sessions_dir = "sessions"
