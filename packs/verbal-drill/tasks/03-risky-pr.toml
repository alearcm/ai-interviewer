[task]
id = "risky-pr"
title = "Big risky PR, deadline tomorrow"
tags = ["review", "tradeoffs"]
statement = "A teammate's 3000-line PR lands the feature you demo tomorrow. It touches auth. Approve, block, or something else — what's your call?"
notes = '''
