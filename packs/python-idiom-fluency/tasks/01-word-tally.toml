[task]
id = "word-tally"
title = "Word tally"
tags = ["counting", "dict-and-set"]
focus = ["counting-by-hand", "manual-best-scan", "membership-branch"]
check = '''
assert top_words("a b a c a b", 2) == [("a", 3), ("b", 2)]
assert top_words("z y x", 2) == [("x", 1), ("y", 1)]
assert top_words("The the THE cat", 1) == [("the", 3)]
assert top_words("dog, dog! cat", 2) == [("dog", 2), ("cat", 1)]
assert top_words("", 3) == []
'''

statement = '''
In solution.py, write:

    def top_words(text, k):
        ...

Return the k most frequent words in `text` as a list of (word, count)
tuples, most frequent first.

Example:
    top_words("a b a c a b", 2) -> [("a", 3), ("b", 2)]
'''

notes = '''
Planted ambiguities — resolve ONLY if asked, one short sentence each:
1. Case: "Is 'The' the same word as 'the'?" -> Yes, fold case before counting.
2. Ties: "What order for equal counts?" -> Break ties alphabetically.
3. Punctuation: "Do I strip punctuation?" -> Words are whitespace-separated
   tokens; strip leading/trailing punctuation, keep inner (e.g. "don't").
If asked anything not listed here: the statement is all they get.
'''

appendix = '''
Designed to elicit: collections.Counter + most_common, or sorted() with a
(-count, word) key. Watch for a hand-rolled count dict ("if w not in d")
and a manual best-so-far scan instead of sorted/most_common.

Hidden checks (for after the session — the interviewer never runs these):
    assert top_words("a b a c a b", 2) == [("a", 3), ("b", 2)]
    assert top_words("z y x", 2) == [("x", 1), ("y", 1)]
    assert top_words("The the THE cat", 1) == [("the", 3)]
    assert top_words("dog, dog! cat", 2) == [("dog", 2), ("cat", 1)]
    assert top_words("", 3) == []

Reference:
    import string
    from collections import Counter

    def top_words(text, k):
        words = (w.strip(string.punctuation).lower() for w in text.split())
        counts = Counter(w for w in words if w)
        return sorted(counts.items(), key=lambda kv: (-kv[1], kv[0]))[:k]
'''
