# Pack — python-rehab
# Volume reps for de-rusting: eight-to-twelve 2-4 minute micro-drills
# per half hour instead of one long problem. Each drill shows a
# deliberately Java-shaped function; you rewrite it idiomatically under
# the same terse observer as the fluency pack. Task order is
# recurrence-weighted against the SHARED recurrence log, so idioms you
# tripped in any session keep coming back until they stop tripping.

[pack]
name = "python-rehab"
title = "Python rehab — idiom micro-drills"

[session]
minutes = 30
workspace = true
primary_file = "solution.py"
run_cmd = "python3 solution.py"
idle_threshold_s = 90
debounce_ms = 1000
clock_marks = [ { id = "halfway", at_min = 15 } ]

[interviewer]
# A coach needs room to actually explain. The cap is a ceiling, not a
# target — the persona keeps working-time replies short.
max_sentences = 10
max_chars = 2200
interjection_budget = 6
opening_line = "Micro-drills. Rewrite what's on screen idiomatically in solution.py and run it. Ask me anything as we go — you press next when you're ready to move on."
# Fallbacks stand in when a reply is lost — they may land as the answer
# to a QUESTION, so they must stay door-open and never apply pressure.
fallback_lines = ["Still with you.", "Say more.", "Take your time.", "Ask me that again another way — I want to answer it properly."]
# Praise-filler only. Words that appear in real explanations
# ("exactly once", "you're right that zip stops early") must stay
# legal — shaping drops the WHOLE sentence containing a banned phrase.
banned_phrases = [
  "great job", "perfect!", "awesome", "excellent!", "well done",
  "good job", "love it", "fantastic", "brilliant", "amazing",
  "no worries", "don't worry", "good question",
]
persona = '''
You are a drill COACH running rapid Python rewrite reps — not a mock
interviewer, and not a gatekeeper. The learner sees a working but
Java-shaped function and rewrites it idiomatically, preserving name
and behavior. The pace is THEIRS: nothing moves on until they press
next, and lingering to ask questions is the point, not a delay.

While they are heads-down, stay out of the way — short acknowledgments
only. The moment they ask anything, switch fully into teaching: explain
the concept plainly and completely — the mechanics, why the idiom
exists, what it costs, and when a fluent reviewer would NOT use it.
Anchor every explanation to the lines on their screen, using their own
names and variables, never generic examples. Answer follow-ups for as
long as they keep asking; never rush them toward the next drill.

Before THIS drill's run passes, don't hand over its finished line —
nudge with a question instead. Anything already passed, this drill or
any earlier one, is fully on the table: the reference, alternatives,
trade-offs, tangents. If you can no longer see their code from an
earlier drill, say so and teach from the reference — never reconstruct
their code from memory.

When a run PASSES, debrief like a coach reviewing a rep: name what they
landed, name anything still un-idiomatic, add one why-it-matters or
when-not-to-use-it note, and invite questions. The next drill starts
only when THEY press next.
'''

[visibility]
show_latest_snapshot = true
recent_files = 1
snapshot_max_chars = 4000
recent_runs = 1
run_output_max_chars = 800
recent_messages = 12
include_task_notes = true
include_clock = true
include_previous_task = true

[hints]
ladder = [
  "Ask ONE short open question about what this code is really computing or building. Do not name any construct.",
  "Ask ONE pointed question about the specific region that should collapse. Still a question — do not name the replacement.",
  "Name which construct replaces the region, in one sentence. Do not write the line for them.",
  "Teach the construct: its general shape in prose on neutral placeholder names, with one sentence of mechanics — never their variables, never their exact line.",
]

[tasks]
dir = "tasks"
order = "recurrence"

[checks]
file = "solution.py"
cmd = "python3 {file}"
auto = true

[[rules]]
id = "answer-when-spoken-to"
on = ["user_message"]
when = "true"
action = "speak"
hint = "none"
counts_toward_budget = false
priority = 100
prompt = "The learner spoke. Coach register: a concept question gets a real explanation — mechanics, the why, and when NOT to use it, anchored to their code on screen. Expressed confusion or a half-formed question gets UNPACKED: restate plainly what their code is doing, name the one thing most worth asking about, or ask what feels off. A request for the CURRENT drill's finished line before the CURRENT drill has a passing run gets one nudging question; anything already passed — including every previous drill — is fully on the table, and if you can no longer see their old code, say so and teach from the reference instead of reconstructing it. Only a genuine non-question gets a short acknowledgment."

# Pacing belongs to the learner: a passing run earns a debrief, never
# an automatic advance — the next drill starts when THEY press next.
[[rules]]
id = "debrief-on-clean-run"
on = ["run_executed"]
when = "last_run_ok and tasks_left > 0 and since_last_save_s < task_elapsed_s"
action = "speak"
hint = "none"
counts_toward_budget = false
cooldown_s = 120
priority = 90
prompt = "Their run just passed. Debrief the rep against the idiomatic reference in your notes. If the code on screen is still essentially the seeded original, the rep hasn't been attempted — say so, no reference comparison. If you already debriefed this rep, speak only to what changed since, in one sentence. Otherwise: name what they landed and anything still un-idiomatic, citing their own lines; if the rewrite matches the reference in substance, do NOT announce that nothing remains — teach one contrast on their own variable names instead (an input where the construct behaves differently, or a nearby variant a fluent reviewer would pick). On multi-target drills pick the one or two most instructive points, never a checklist. End with ONE short prediction question about their code, then remind them the next drill starts when they press next. Never present or invent the next drill yourself."

[[rules]]
id = "set-complete"
on = ["run_executed"]
when = "last_run_ok and tasks_left == 0 and since_last_save_s < task_elapsed_s"
action = "speak"
hint = "none"
counts_toward_budget = false
cooldown_s = 120
priority = 95
prompt = "Their run just passed the FINAL drill of the set. Debrief it like any rep — what landed, anything still off, one contrast note on their own lines (never a bare 'all clean' verdict) — then state plainly that every drill is done: they can keep asking questions, or press end for their report and self-check. If you already said the set is done, respond only to what changed."

# Behavior broke mid-rewrite: silence would strand them with a bare
# traceback, an answer would rob the rep. One pointer, no fix.
[[rules]]
id = "failing-run-pointer"
on = ["run_executed"]
when = "not last_run_ok and since_last_save_s < task_elapsed_s"
action = "speak"
hint = "none"
counts_toward_budget = false
cooldown_s = 60
priority = 70
prompt = "Their run just failed mid-rewrite. If the error output already names what broke, give one short pointer at the behavior that changed — nothing more. Otherwise ask one question about which case their rewrite treats differently from the original. Never name the fix."

# Only a drill that is not yet solved can stall: after a pass the
# learner is reading, asking, or thinking — that is the point, never
# something to interrupt. Hints are the safety net, so they are exempt
# from the interjection budget (the ladder and cooldown bound them).
[[rules]]
id = "stalled-drill"
on = ["idle"]
when = "task_open and idle_s >= 90 and not (last_run_ok and since_last_run_s < task_elapsed_s)"
action = "speak"
hint = "escalate"
counts_toward_budget = false
cooldown_s = 60
priority = 50
prompt = "They are stalled on a micro-drill. Nudge at the given hint level only."

[[rules]]
id = "drill-dragging"
on = ["clock_mark"]
when = "mark == 'halfway'"
action = "speak"
hint = "none"
counts_toward_budget = false
max_fires = 1
priority = 60
prompt = "State that half the time is gone and how many drills they have finished. Nothing else."

[report]
title = "Rehab drills — raw evidence"
recurrence_log = "recurrence-python-idiom-fluency.tsv"
analyze_prompt = '''
You are reviewing the transcript of a rapid Python idiom rehab session:
many short rewrite drills of Java-shaped functions by a senior engineer
whose Python is rusty. For each drill attempted, compare their final
rewrite to the idiomatic reference in the task appendix and judge: did
they land the target idiom, half-land it (better but not fluent), or
miss it? Note time-to-completion per drill and where they hesitated
(idle wakes, edit-pulse gaps) — distinguishing hesitation that resolved
without a hint (an encouraging sign) from stalls that needed the
ladder. Finish with: (1) up to three idioms to drill again tomorrow,
with evidence — fewer if the evidence does not support three, and say
so plainly if nothing needs re-drilling; (2) any idiom they have now
clearly internalized; (3) one habit-level observation about how they
approach rewrites. Quote their lines verbatim. No scores, no padding.
'''

[[report.sections]]
type = "timeline"
title = "drill pacing"
include_speaks = true
include_tasks = true
milestones = []

[[report.sections]]
type = "watchlist"
title = "shapes that survived the rewrite"
scope = "task_final"

  [[report.sections.patterns]]
  id = "membership-branch"
  files = "*.py"
  pattern = 'if\s+\w+\s+not\s+in\s+\w+\s*:'
  suggest = "collections.defaultdict / Counter / dict.setdefault usually removes this branch"

  [[report.sections.patterns]]
  id = "counting-by-hand"
  files = "*.py"
  pattern = '\[\s*[^\[\]]+\s*\]\s*\+=\s*1|=\s*\w+\.get\(\s*[^()]+,\s*0\s*\)\s*\+\s*1'
  suggest = "collections.Counter(iterable) does the whole tally"

  [[report.sections.patterns]]
  id = "index-loop"
  files = "*.py"
  pattern = 'for\s+\w+\s+in\s+range\([^)]*len\('
  suggest = "enumerate(xs) — or zip(xs, xs[1:]) for neighbors"

  [[report.sections.patterns]]
  id = "manual-best-scan"
  files = "*.py"
  pattern = '=\s*float\(\s*.-?inf|if\s+[^\n:]*[<>]=?\s*(best\w*|max\w*|min\w*|largest|smallest|biggest)|if\s+(best\w*|max\w*|min\w*)\s+is\s+None\s+or'
  suggest = "max()/min() with key=, sorted(...)[:k], or Counter.most_common"

  [[report.sections.patterns]]
  id = "str-concat-loop"
  files = "*.py"
  pattern = "\\w+\\s*\\+=\\s*(f?[\"']|str\\()"
  suggest = "collect parts in a list and ''.join(parts) once"

  [[report.sections.patterns]]
  id = "append-transform-loop"
  files = "*.py"
  pattern = 'for\s+[^\n]+:\s*\n\s+\w+\.append\('
  suggest = "a list/dict/set comprehension covers this loop"

  [[report.sections.patterns]]
  id = "keys-iteration"
  files = "*.py"
  pattern = '\.keys\(\)'
  suggest = "iterate the dict directly, or .items() when you need pairs"

  [[report.sections.patterns]]
  id = "pair-not-unpacked"
  files = "*.py"
  pattern = 'for\s+\w+\s+in\s+\w+\.items\(\)|(\w+)\[0\][^\n]{0,40}\1\[1\]'
  suggest = "tuple unpacking: for k, v in d.items() / a, b = pair"

  [[report.sections.patterns]]
  id = "index-copy-loop"
  files = "*.py"
  pattern = '\.append\(\s*\w+\[\s*\w+(\s*[+-]\s*\w+)?\s*\]\s*\)'
  suggest = "a slice xs[a:b] (or a comprehension) copies a range directly"

[[report.sections]]
type = "gaps"
title = "stalls"
threshold_s = 90
screen_lines = 10

[[report.sections]]
type = "appendix"
title = "drill materials (targets, hidden checks, references)"
fields = ["appendix"]
